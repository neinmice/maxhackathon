server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This container serves the Mini App only. API and bot traffic is split by
    # Caddy (or the Vite dev proxy) before it reaches nginx. An unmatched /api
    # request must stay an error, never index.html with HTTP 200.
    location /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"API route is not served by the web container"}}';
    }

    location /webhooks/ {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Webhook route is not served by the web container"}}';
    }

    location = /health {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Health route is not served by the web container"}}';
    }

    location = /bot/health {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Health route is not served by the web container"}}';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
