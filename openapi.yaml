openapi: 3.1.0
info:
  title: ZVERY Business Navigator API
  version: 0.1.0
servers:
  - url: http://localhost:8000
  - url: https://zverybot.ru
paths:
  /health:
    get:
      responses:
        '200':
          description: OK
  /api/v1/catalog/filters:
    get:
      responses:
        '200':
          description: Available filters
  /api/v1/recommendations:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Matching prepared records
  /api/v1/measures/{measure_id}:
    get:
      parameters:
        - in: path
          name: measure_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Measure card
        '404':
          description: Measure not found
  /api/v1/auth/max/launch-data:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data: {type: string}
      responses:
        '200':
          description: Verified MAX user
        '401':
          description: Invalid launch data
  /api/v1/measures/{measure_id}/save:
    post:
      parameters:
        - in: path
          name: measure_id
          required: true
          schema: {type: string}
        - in: header
          name: X-Max-Init-Data
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Measure saved
    delete:
      parameters:
        - in: path
          name: measure_id
          required: true
          schema: {type: string}
        - in: header
          name: X-Max-Init-Data
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Measure unsaved
  /api/v1/measures/saved:
    get:
      parameters:
        - in: header
          name: X-Max-Init-Data
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Saved measure ids
  /api/v1/quiz/submit:
    post:
      parameters:
        - in: header
          name: X-Max-Init-Data
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quiz_version, answers]
              properties:
                quiz_version: {type: string}
                answers: {type: object, additionalProperties: {type: string}}
      responses:
        '200':
          description: Quiz result and optional signed certificate payload
  /api/v1/notifications/opt-in:
    post:
      parameters:
        - in: header
          name: X-Max-Init-Data
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200':
          description: Notification preference updated
  /webhooks/max:
    post:
      parameters:
        - in: header
          name: X-Max-Bot-Api-Secret
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: MAX update accepted
components:
  schemas:
    RecommendationRequest:
      type: object
      required: [region, role, tax_mode]
      properties:
        region: {type: string, enum: [kazan, moscow, spb]}
        role: {type: string, enum: [ip, self_employed, llc]}
        tax_mode: {type: string}
        sector: {type: string}
        goal: {type: string}
